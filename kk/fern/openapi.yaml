openapi: 3.0.0
paths:
  /v1/challenge/{challenge}/solve:
    post:
      description: This method is used for solving `Challenge`
      operationId: solve
      parameters:
        - name: challenge
          required: true
          in: path
          description: Challenge identifier
          schema:
            minLength: 36
            maxLength: 36
            format: uuid
            pattern: >-
              ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-5][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$


            nullable: false
            example: 2559c4b6-98a3-4f60-a6bc-13e22ccf2908
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChallengeSolveRequestBody"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChallengeSolveResponse"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExceptionBadRequest"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExceptionUnauthorized"
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExceptionNotFound"
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExceptionInternalServerError"
      security:
        - publicAuthorization: []
      summary: Solving `Challenge`
      tags:
        - Challenge
  /v1/challenge/{challenge}/verify:
    post:
      description: This method is used for verifying `Challenge`
      operationId: verify
      parameters:
        - name: challenge
          required: true
          in: path
          description: Challenge identifier
          schema:
            minLength: 36
            maxLength: 36
            format: uuid
            pattern: >-
              ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-5][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$


            nullable: false
            example: d9c2a6b1-0e75-4a57-8197-82ab105539a2
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChallengeVerifyRequestBody"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChallengeVerifyResponse"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExceptionBadRequest"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExceptionUnauthorized"
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExceptionNotFound"
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExceptionInternalServerError"
      security:
        - secretAuthorization: []
      summary: Verifying `Challenge`
      tags:
        - Challenge
  /v1/challenge:
    post:
      description: This method is used for creating `Challenge`
      operationId: create
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChallengeCreateBody"
      responses:
        "201":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChallengeCreateResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExceptionUnauthorized"
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExceptionInternalServerError"
      security:
        - publicAuthorization: []
      summary: Creating `Challenge`
      tags:
        - Challenge
info:
  title: X-CAPTCHA
  description: X-CAPTCHA `Reaper API` documentation
  version: "1"
  contact: {}
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: ""
tags: []
servers:
  - url: http://127.0.0.1:3000
components:
  securitySchemes:
    publicAuthorization:
      type: apiKey
      in: header
      name: X-Public-Key
      description: Public key
    secretAuthorization:
      type: apiKey
      in: header
      name: X-Secret-Key
      description: Secret key
  schemas:
    ChallengeCreateBody:
      type: object
      properties:
        type:
          type: string
          description: Challenge type
          nullable: false
          example: click
          enum:
            - click
            - pow
      required:
        - type
    ChallengeCreateBodyclient:
      type: object
      properties: {}
    ChallengeCreateResponseDataClick:
      type: object
      properties:
        challenge:
          type: boolean
          description: Challenge data click challenge
          nullable: false
          example: true
          readOnly: true
        type:
          type: string
          description: Challenge data type
          nullable: false
          example: click
          enum:
            - click
            - pow
          readOnly: true
      required:
        - challenge
        - type
    ChallengeCreateResponseDataPow:
      type: object
      properties:
        challenge:
          type: string
          description: Challenge data PoW challenge
          nullable: false
          maxLength: 32
          minLength: 32
          example: 683d2b8b9b06b518de4b55e6f289e5fd
          format: lowercase-string
          pattern: ^[a-f0-9]{32}
          readOnly: true
        difficulty:
          type: integer
          description: Challenge data difficulty
          format: int32
          nullable: false
          example: 1
          minimum: 0
          maximum: 32
          readOnly: true
        type:
          type: string
          description: Challenge data type
          nullable: false
          example: click
          enum:
            - click
            - pow
          readOnly: true
      required:
        - challenge
        - difficulty
        - type
    ChallengeCreateResponse:
      type: object
      properties:
        createdAt:
          type: string
          description: Challenge creation date
          nullable: false
          minLength: 24
          maxLength: 24
          example: "2025-01-01T00:00:00.000Z"
          pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}.[0-9]{3}Z$
          format: date-time
          readOnly: true
        data:
          description: Challenge data
          nullable: false
          oneOf:
            - $ref: "#/components/schemas/ChallengeCreateResponseDataClick"
            - $ref: "#/components/schemas/ChallengeCreateResponseDataPow"
          discriminator:
            mapping:
              click: "#/components/schemas/ChallengeCreateResponseDataClick"
              pow: "#/components/schemas/ChallengeCreateResponseDataPow"
            propertyName: type
          readOnly: true
        id:
          type: string
          description: Challenge identifier
          nullable: false
          minLength: 36
          maxLength: 36
          example: a84892b9-03e2-4238-90bc-1e48b136cb80
          format: uuid
          pattern: >-
            ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-5][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$


          readOnly: true
        type:
          type: string
          description: Challenge type
          nullable: false
          example: click
          enum:
            - click
            - pow
          readOnly: true
        updatedAt:
          type: string
          description: Challenge last update date
          nullable: false
          minLength: 24
          maxLength: 24
          example: "2025-01-01T00:00:00.000Z"
          pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}.[0-9]{3}Z$
